[project]
name = "cliniscribe-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 115
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP017: prefers `datetime.UTC` (3.11+ alias). Local dev in this environment
# runs on Python 3.10 (3.12 unavailable); `timezone.utc` works on 3.10-3.13+
# and is functionally identical, so it's kept for portability.
# B008: flags `Depends(...)` in argument defaults — that is FastAPI's
# required dependency-injection idiom, not a bug.
ignore = ["UP017", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
